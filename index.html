<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShiftMate Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9E7E1;--navy:#0E1F40;--org:#FF7A1A;--ow:#F8F6F1;--card:#fff;--ink:#0E1F40;--mut:#6B7690;--line:#E4E1D8;--ok:#1E9E6A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141C}}
:root[data-theme="dark"]{--bg:#10141C}
html{height:100%}*{box-sizing:border-box;margin:0}
body{min-height:100%;background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px 0;color:var(--ink)}
.phone{width:390px;height:844px;flex:none;background:var(--ow);border-radius:44px;border:10px solid #0A0F1C;box-shadow:0 30px 70px rgba(10,15,28,.35),0 0 0 2px #2a3144;position:relative;overflow:hidden}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:28px;background:#0A0F1C;border-radius:0 0 18px 18px;z-index:50}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;padding:12px 26px 0;font-size:12px;font-weight:700;z-index:40;pointer-events:none}
#app{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:44px;background:var(--ow)}
.scr.r{animation:inR .35s ease}.scr.l{animation:inL .35s ease}
@keyframes inR{from{transform:translateX(100%)}}@keyframes inL{from{transform:translateX(-100%)}}
.body{flex:1;overflow-y:auto;padding:8px 20px 20px}.body::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.pri{background:var(--org);color:#fff;box-shadow:0 8px 18px rgba(255,122,26,.3)}.out{border:2px solid var(--navy);color:var(--navy)}.nv{background:var(--navy);color:#fff}
.btn small{display:block;font-weight:500;font-size:11px;opacity:.85}
.btn:active{transform:scale(.98)}.btn.done{background:var(--ok);box-shadow:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:24px;line-height:1.2;font-weight:800}h2{font-size:17px;font-weight:800}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.chips{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;background:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ok);background:rgba(30,158,106,.12);padding:4px 9px;border-radius:99px}
.tag svg{width:12px;height:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:800;color:var(--org);font-size:16px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 8px 18px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--org)}
.top{display:flex;align-items:center;gap:10px;padding:6px 20px}
.back{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:var(--org)}
.map{height:340px;border-radius:20px;background:#DDE6E1;position:relative;overflow:hidden;background-image:linear-gradient(#fff6 2px,transparent 2px),linear-gradient(90deg,#fff6 2px,transparent 2px);background-size:60px 60px}
.pin{position:absolute;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:6px 10px;border-radius:99px;border:2px solid #fff}
.pin.o{background:var(--org)}
.esc{background:var(--navy);color:#fff;border-radius:20px;padding:18px;margin:16px 0}
.flow{display:flex;align-items:center;gap:6px;margin:12px 0;font-size:11.5px;font-weight:600}
.flow span{flex:1;background:#ffffff1c;border-radius:12px;padding:10px 6px;text-align:center}.flow b{color:var(--org)}
.ov{position:absolute;inset:0;background:rgba(10,15,28,.5);z-index:30;display:flex;align-items:flex-end;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--ow);width:100%;border-radius:28px 28px 0 0;padding:18px 20px 28px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.steps{display:flex;gap:6px;margin:10px 0 16px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--org)}
.sug{background:rgba(255,122,26,.12);border-radius:14px;padding:12px;font-size:13px;font-weight:600;margin-bottom:14px}
.cnt{display:flex;align-items:center;gap:16px}.cnt button{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;font-weight:700}
.load{position:absolute;inset:0;background:#0E1F40e6;z-index:60;display:grid;place-items:center}
.sp{width:46px;height:46px;border-radius:50%;border:5px solid #ffffff40;border-top-color:var(--org);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;left:20px;right:20px;bottom:100px;background:var(--navy);color:#fff;padding:14px;border-radius:14px;font-size:13px;font-weight:600;z-index:70;text-align:center;animation:fade .2s}
.sw{display:flex;background:var(--line);border-radius:99px;padding:3px}.sw button{padding:6px 14px;border-radius:99px;font-weight:700;font-size:12px;color:var(--mut)}.sw button.on{background:var(--navy);color:#fff}
.menu{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.timer{font-size:52px;font-weight:800;text-align:center;letter-spacing:1px;margin:10px 0;font-variant-numeric:tabular-nums}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="phone"><div class="notch"></div><div class="sb"><span>09:41</span><span>5G ▮▮▮</span></div><div id="app"></div><div id="fx"></div></div>
<script>
const D={
sub:["Platform Shift F&B Terpercaya","Trusted F&B Shift Platform"],
lw:["Masuk sebagai Pekerja","Login as Worker"],lws:["Cari shift fleksibel","Find flexible shifts"],
le:["Masuk sebagai UMKM","Login as Employer"],les:["Rekrut staf part-time","Hire part-time staff"],
noacc:["Belum punya akun?","No account yet?"],reg:["Daftar di sini","Sign up here"],
gm:["Selamat pagi, Dinda.","Good morning, Dinda."],m3:["shift cocok untukmu","shifts match you"],
list:["Daftar","List"],map:["Peta","Map"],today:["Tersedia hari ini","Available today"],wk:["Akhir pekan saja","Weekends only"],
safe:["Dana aman","Funds secured"],td:["Hari ini","Today"],sat:["Sabtu","Saturday"],sun:["Minggu","Sunday"],wd:["Jumat","Friday"],
shifts:["Shift","Shifts"],mine:["Shiftku","Mine"],wallet:["Dompet","Wallet"],profile:["Profil","Profile"],
nt:["Hari ini","Today"],hire:["Rekrut","Hire"],team:["Tim","Team"],
hello:["Halo, Kopi Senja.","Hello, Kopi Senja."],act4:["4 shift aktif minggu ini","4 active shifts this week"],
post:["Pasang Shift Baru","Post New Shift"],cand:["Lihat Kandidat Cocok","View Matching Candidates"],
actl:["Shift Aktif","Active Shifts"],need:["staf dibutuhkan","staff needed"],
earn:["Kamu dapat","You earn"],esc:["SecurePay Escrow","SecurePay Escrow"],
f1:["Dana UMKM dikunci","Funds locked"],f2:["Kamu kerja","You work"],f3:["Langsung cair","Paid instantly"],
locked:["sudah dikunci.","is already locked."],apply:["Lamar shift ini","Apply for this shift"],applied:["Lamaran terkirim ✓","Application sent ✓"],
detTxt:["Kopi Senja · Jl. Sumatra 12 · 16:00–21:00 (5 jam). Bawa apron sendiri.","Kopi Senja · Jl. Sumatra 12 · 4–9 PM (5 hrs). Bring your own apron."],
when:["Kapan butuh bantuan?","When do you need help?"],sug:["💡 Biasanya butuh 2 staf ekstra hari Sabtu","💡 You usually need 2 extra staff on Saturdays"],
who:["Siapa yang dibutuhkan?","Who do you need?"],qty:["Jumlah","Quantity"],
bud:["Budget & escrow","Budget & escrow"],calc:["2 staf × 5 jam × Rp 30k","2 staff × 5 hrs × Rp 30k"],lock:["Dana dikunci di escrow dan cair setelah shift selesai.","Funds are held in escrow and released after the shift."],
conf:["Konfirmasi & Kunci Dana","Confirm & Lock Funds"],next:["Lanjut","Next"],posted:["Shift terpasang. Dana Rp 300.000 dikunci.","Shift posted. Rp 300,000 locked."],
match:["2 kecocokan untuk Shift Barista","2 matches for Barista Shift"],ot:["tepat waktu","on-time"],roi:["Biaya rekrutmen: Rp 15k","Recruitment cost: Rp 15k"],
rec:["Rekrut","Hire"],recd:["Direkrut ✓","Hired ✓"],
started:["Shift dimulai. Dana dikunci menunggumu.","Shift started. Locked funds are waiting for you."],
livet:["Live. Staf di tempat.","Live. Staff on site."],end:["Akhiri shift & cairkan gaji","End shift & release pay"],paid:["Gaji dicairkan. Terima kasih!","Pay released. Thank you!"],
elapsed:["Waktu berjalan","Elapsed time"],checkin:["Buka shift aktif","Open active shift"],
trust:["Skor Kepercayaan","Trust Score"],edit:["Ubah Profil","Edit Profile"],pay:["Pembayaran","Payment Methods"],notif:["Notifikasi","Notifications"],
lang:["Bahasa","Language"],out:["Keluar","Log Out"],
bal:["Saldo tersedia","Available balance"],lockd:["Dana dikunci","Locked funds"],
none:["Belum ada shift cocok dengan filter ini.","No shifts match these filters."],
sh1:["Shift diambil: Barista · Kopi Senja","Booked shift: Barista · Kopi Senja"],
tm:["Staf tetap & cadangan","Core & backup staff"],back:["Kembali","Back"]};
const t=k=>D[k][S.lang];
const S={lang:0,role:null,tab:'shifts',v:null,view:'list',fT:false,fW:false,loading:false,sheet:0,qty:2,rl:'Barista',applied:false,hired:false,day:'sat'};
const I={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',store:'<path d="M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',wallet:'<path d="M3 7h16a2 2 0 012 2v10H5a2 2 0 01-2-2zM3 7V5a2 2 0 012-2h12M16 14h2"/>',team:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 5a3 3 0 010 6M21 20c0-2-1-4-3-4.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/>',chev:'<path d="M9 5l7 7-7 7"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',check:'<path d="M5 12l5 5 9-10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const SH=[{k:'barista',n:'Barista · Kopi Senja',d:'td',tm:'16:00',p:'Rp 180.000',safe:1,today:1,wk:0,x:30,y:60},{k:'waiter',n:'Waiter · Warung Bu Tini',d:'sat',tm:'10:00',p:'Rp 150.000',safe:1,today:0,wk:1,x:200,y:150},{k:'kitchen',n:'Kitchen helper · Bakso 99',d:'wd',tm:'11:00',p:'Rp 140.000',safe:0,today:0,wk:0,x:90,y:240}];
function login(){return `<div class="body" style="display:flex;flex-direction:column;justify-content:center;gap:14px;padding:30px 24px">
<div style="margin-bottom:26px"><div class="logo"><i>${ic('brief')}</i>ShiftMate</div><p class="mut" style="margin-top:12px;font-size:15px">${t('sub')}</p></div>
<button class="btn pri" onclick="login_('worker')">${ic('user')}<span>${t('lw')}<small>${t('lws')}</small></span></button>
<button class="btn out" onclick="login_('employer')">${ic('store')}<span>${t('le')}<small>${t('les')}</small></span></button>
<p class="mut" style="text-align:center;margin-top:18px">${t('noacc')} <a style="color:var(--org);font-weight:700">${t('reg')}</a></p></div>`}
function nav(items){return `<nav>${items.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${ic(i)}${t(l)}</button>`).join('')}</nav>`}
function cardW(s){return `<div class="card" onclick="go('detail')" style="cursor:pointer"><div class="row"><h2 style="font-size:15px">${s.n}</h2>${s.safe?`<span class="tag">${ic('lock')}${t('safe')}</span>`:''}</div><div class="row" style="margin-top:10px"><span class="mut">${t(s.d)} ${s.tm}</span><span class="price">${s.p}</span></div></div>`}
function workerHome(){let L=SH.filter(s=>(!S.fT||s.today)&&(!S.fW||s.wk));
let c=S.view==='map'?`<div class="map">${SH.map(s=>`<div class="pin ${s.today?'o':''}" style="left:${s.x}px;top:${s.y}px" onclick="go('detail')">${s.p}</div>`).join('')}</div>`:(L.length?L.map(cardW).join(''):`<p class="mut" style="padding:30px 0;text-align:center">${t('none')}</p>`);
return `<div class="body"><h1>${t('gm')}<br><span style="color:var(--org)">3 ${t('m3')}</span></h1>
<div class="chips"><button class="chip ${S.view==='list'?'on':''}" onclick="S.view='list';render()">${t('list')}</button><button class="chip ${S.view==='map'?'on':''}" onclick="S.view='map';render()">${t('map')}</button><button class="chip ${S.fT?'on':''}" onclick="S.fT=!S.fT;render()">${t('today')}</button><button class="chip ${S.fW?'on':''}" onclick="S.fW=!S.fW;render()">${t('wk')}</button></div>${c}</div>`}
function mine(){return `<div class="body"><h1 style="margin-bottom:14px">${t('mine')}</h1>${S.applied?`<div class="card"><h2 style="font-size:15px">${t('sh1')}</h2><p class="mut" style="margin:6px 0 12px">${t('td')} 16:00 · Rp 180.000</p><button class="btn pri" onclick="go('active')">${t('checkin')}</button></div>`:`<p class="mut">${t('none')}</p>`}</div>`}
function wal(){return `<div class="body"><h1 style="margin-bottom:14px">${t('wallet')}</h1><div class="esc"><p style="opacity:.7;font-size:12px">${t('bal')}</p><div style="font-size:30px;font-weight:800;margin:4px 0">Rp 1.240.000</div></div><div class="card row"><span>${t('lockd')}</span><b class="price">${S.role==='worker'?'Rp 180.000':'Rp 300.000'}</b></div></div>`}
function profile(){const w=S.role==='worker';return `<div class="body" style="display:flex;flex-direction:column"><div style="text-align:center;margin:10px 0 18px"><div class="av" style="width:76px;height:76px;font-size:30px;margin:0 auto 10px;background:var(--org)">${w?'D':'K'}</div><h1>${w?'Dinda':'Admin Kopi Senja'}</h1><span class="tag" style="margin-top:8px">${ic('check')}${t('trust')}: ${w?'4.9':'4.8'} / 5</span></div>
${[['user','edit'],['card','pay'],['bell','notif']].map(([i,l])=>`<div class="menu">${ic(i)}<span style="flex:1">${t(l)}</span>${ic('chev')}</div>`).join('')}
<div class="menu" style="border:0">${ic('list')}<span style="flex:1">${t('lang')}</span><div class="sw"><button class="${S.lang===0?'on':''}" onclick="S.lang=0;render()">ID</button><button class="${S.lang===1?'on':''}" onclick="S.lang=1;render()">EN</button></div></div>
<button class="btn" style="color:#D93636;margin-top:auto;border:1.5px solid #D93636" onclick="logout()">${ic('out')}${t('out')}</button></div>`}
function empHome(){return `<div class="body"><div class="row"><h1>${t('hello')}<br><span style="color:var(--org)">${t('act4')}</span></h1><button class="av" onclick="go('profile')">K</button></div>
<div style="display:flex;flex-direction:column;gap:10px;margin:18px 0"><button class="btn pri" onclick="S.sheet=1;S.step=1;render()">${ic('plus')}${t('post')}</button><button class="btn out" onclick="go('cand')">${t('cand')}</button></div>
<h2 style="margin-bottom:10px">${t('actl')}</h2>
<div class="card"><div class="row"><h2 style="font-size:15px">Barista</h2><span class="tag">${t('sat')}</span></div><p class="mut" style="margin-top:6px">2 ${t('need')}</p></div>
<div class="card"><div class="row"><h2 style="font-size:15px">Waiter</h2><span class="tag">${t('sun')}</span></div><p class="mut" style="margin-top:6px">1 ${t('need')}</p></div>
<div class="card" style="cursor:pointer;border-color:var(--ok)" onclick="go('active')"><span class="live"></span><b>${t('livet')}</b></div></div>`}
function hirePg(){return cand(true)}
function teamPg(){return `<div class="body"><h1 style="margin-bottom:6px">${t('team')}</h1><p class="mut" style="margin-bottom:14px">${t('tm')}</p>${['Rafi Pratama','Sari Utami','Bayu Aditya'].map(n=>`<div class="card row"><div class="row" style="justify-content:flex-start"><div class="av">${n[0]}</div><b>${n}</b></div><span class="tag">98%</span></div>`).join('')}</div>`}
function cand(tab){return `<div class="body"><h1 style="margin-bottom:14px">${t('match')}</h1>${[['Rafi Pratama','98%'],['Sari Utami','95%']].map(([n,p],i)=>`<div class="card"><div class="row" style="justify-content:flex-start;gap:12px"><div class="av" style="width:48px;height:48px">${n[0]}</div><div><b>${n}</b><div class="mut">${p} ${t('ot')}</div></div></div><p class="mut" style="margin:12px 0;color:var(--org);font-weight:700">${t('roi')}</p><button class="btn ${S.hired&&i==0?'done':'nv'}" style="padding:12px" onclick="${i==0?"S.hired=true;render()":"toast(t('recd'))"}">${S.hired&&i==0?t('recd'):t('rec')}</button></div>`).join('')}</div>`}
function detail(){return `<div class="body"><h1>Barista · Kopi Senja</h1><p style="margin:8px 0" class="mut">${t('detTxt')}</p><p style="font-size:18px;font-weight:700">${t('earn')} <span class="price" style="font-size:22px">Rp 180.000</span></p>
<div class="esc"><div class="row"><b>${ic('lock')} ${t('esc')}</b></div><div class="flow"><span>${t('f1')}</span><b>→</b><span>${t('f2')}</span><b>→</b><span>${t('f3')}</span></div><p style="font-size:13px"><b style="color:var(--org)">Rp 180.000</b> ${t('locked')}</p></div>
<button class="btn ${S.applied?'done':'pri'}" onclick="S.applied=true;render()">${S.applied?t('applied'):t('apply')}</button></div>`}
function active(){const w=S.role==='worker';return `<div class="body" style="text-align:center;padding-top:30px"><h2>Barista · Kopi Senja</h2><p class="mut" style="margin-top:4px">${t('elapsed')}</p><div class="timer" id="tm">02:14:08</div>
<div class="card" style="text-align:left">${w?`<span class="tag">${ic('lock')}Rp 180.000</span><p style="margin-top:10px;font-weight:600">${t('started')}</p>`:`<span class="live"></span><b>${t('livet')}</b><p class="mut" style="margin-top:6px">Rafi Pratama · 16:00</p>`}</div>
${w?'':`<button class="btn pri" onclick="toast(t('paid'));S.v=null;render('l')">${t('end')}</button>`}</div>`}
function pushed(){const b=`<div class="top"><button class="back" onclick="S.v=null;render('l')">${ic('back')}</button></div>`;
const m={detail,cand:()=>cand(),active,profile}[S.v];return b+m()}
function main(){let c,n;
if(S.role==='worker'){c={shifts:workerHome,mine,wallet:wal,profile}[S.tab]();n=nav([['shifts','list','shifts'],['mine','brief','mine'],['wallet','wallet','wallet'],['profile','user','profile']])}
else{c={today:empHome,hire:hirePg,wallet:wal,team:teamPg}[S.tab]();n=nav([['today','home','nt'],['hire','plus','hire'],['wallet','wallet','wallet'],['team','team','team']])}
return c+n}
function sheetH(){const s=S.step;let c;
if(s==1)c=`<h2>${t('when')}</h2><div class="sug" style="margin-top:12px">${t('sug')}</div><div class="chips">${['sat','sun','wd'].map(d=>`<button class="chip ${S.day==d?'on':''}" onclick="S.day='${d}';render()">${t(d)}</button>`).join('')}<button class="chip on">16:00–21:00</button></div>`;
else if(s==2)c=`<h2>${t('who')}</h2><div class="chips">${['Barista','Waiter'].map(r=>`<button class="chip ${S.rl==r?'on':''}" onclick="S.rl='${r}';render()">${r}</button>`).join('')}</div><div class="row"><b>${t('qty')}</b><div class="cnt"><button onclick="S.qty=Math.max(1,S.qty-1);render()">−</button><b style="font-size:18px">${S.qty}</b><button onclick="S.qty++;render()">+</button></div></div>`;
else{const tot=S.qty*5*30000;c=`<h2>${t('bud')}</h2><div class="esc"><p style="opacity:.8;font-size:13px">${S.qty} ${S.lang?'staff':'staf'} × 5 ${S.lang?'hrs':'jam'} × Rp 30k</p><div style="font-size:28px;font-weight:800;margin:6px 0">Rp ${tot.toLocaleString('id-ID')}</div><p style="font-size:12px;opacity:.8">${t('lock')}</p></div>`}
const btn=s<3?`<button class="btn pri" onclick="S.step++;render()">${t('next')}</button>`:`<button class="btn pri" onclick="S.sheet=0;render();toast(t('posted'))">${ic('lock')}${t('conf')}</button>`;
return `<div class="ov" onclick="if(event.target===this){S.sheet=0;render()}"><div class="sheet"><div class="steps">${[1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>${c}<div style="margin-top:18px">${btn}</div></div></div>`}
let tmr;
function render(a){clearInterval(tmr);const h=!S.role?login():S.v?pushed():main();
document.getElementById('app').innerHTML=`<div class="scr ${a||''}">${h}</div>${S.sheet?sheetH():''}${S.loading?'<div class="load"><div class="sp"></div></div>':''}`;
if(S.v==='active'){let n=2*3600+14*60+8;tmr=setInterval(()=>{n++;const e=document.getElementById('tm');if(e)e.textContent=[n/3600|0,(n/60|0)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')},1000)}}
function go(v){S.v=v;render('r')}
function login_(r){S.loading=true;render();setTimeout(()=>{S.loading=false;S.role=r;S.tab=r==='worker'?'shifts':'today';S.v=null;S.applied=false;S.hired=false;render('r')},1000)}
function logout(){Object.assign(S,{role:null,v:null,sheet:0});render('l')}
function toast(m){const f=document.getElementById('fx');f.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>f.innerHTML='',2400)}
render();
</script></body></html>
